[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "callrec"
version = "0.2.2"
description = "Offline macOS call capture and original-language transcription"
requires-python = ">=3.11,<3.14"
dependencies = ["mlx-whisper==0.4.3", "mlx-audio==0.6.1", "huggingface-hub>=0.27,<2"]

[project.scripts]
callrec = "callrec.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/callrec"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
